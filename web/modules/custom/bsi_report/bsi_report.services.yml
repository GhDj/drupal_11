services:
  bsi_report.book.outline:
    class: Drupal\bsi_report\BookOutlineDecorator
    decorates: book.outline
    arguments:
      - '@bsi_report.book.outline.inner'
      - '@book.manager'

  bsi_report.book.breadcrumb:
    class: Drupal\bsi_report\BookBreadcrumbDecorator
    decorates: book.breadcrumb
    arguments:
      - '@bsi_report.book.breadcrumb.inner'
      - '@menu_breadcrumb.breadcrumb.default'
      - '@config.factory'
      - '@language_manager'
