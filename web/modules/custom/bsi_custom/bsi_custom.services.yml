services:
  bsi_custom.address_subscriber:
    class: Drupal\bsi_custom\EventSubscriber\BsiCustomAddressSubscriber
    arguments: ['@entity_type.manager']
    tags:
      - { name: event_subscriber }

  bsi_report.breadcrumb:
    class: Drupal\bsi_custom\BreadcrumbManagerDecorator
    decorates: breadcrumb
    arguments:
      - '@bsi_report.breadcrumb.inner'
      - '@config.factory'
      - '@language_manager'
      - '@menu_breadcrumb.breadcrumb.default'
