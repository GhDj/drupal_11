                      value: '<p>Inhalte können wie gewohnt erstellt werden:</p><ul><li data-list-item-id="ee05c8f4493e93a7f6aed2cc131d931e1"><a href="/node/add">Allgemeine Seite "Inhalt erstellen"</a></li><li data-list-item-id="e696fdefb9b60390655afed28d6cee08f"><a href="/node/add/entry_page">Einstiegsseite erstellen</a></li><li data-list-item-id="efa83869021856735a6a3de94b7453a3e"><a href="/node/add/page">Inhaltsseite erstellen</a></li></ul><p>Zudem können Inhalte gezielt im Kontext einer Gruppe erstellt werden. In diesem Fall entfällt das manuelle Hinzufügen zu dieser:</p><ul><li data-list-item-id="e4e97015b91a8c2276da43cfcf4f7a47f"><a href="/group/1/node/create">Inhalt erstellen</a> in Gruppe "Bundesverwaltung"<ul><li data-list-item-id="e00592032a448d317ca07e5204328df83"><a href="/group/1/content/create/group_node:entry_page">Einstiegsseite erstellen</a></li><li data-list-item-id="eafd304223092df1202e2392574f938fc"><a href="/group/1/content/create/group_node:page">Inhaltsseite erstellen</a></li></ul></li><li data-list-item-id="e2875301f16b006e839c889e50b62c5b4"><a href="/group/2/node/create">Inhalt erstellen</a> in Gruppe "Landes- und Kommunalverwaltung"<ul><li data-list-item-id="e8f161205b15d96b84e9680766b09d47c"><a href="/group/2/content/create/group_node:entry_page">Einstiegsseite erstellen</a></li><li data-list-item-id="efc6fc27c67938cf61321a412a6e4d1a2"><a href="/group/2/content/create/group_node:page">Inhaltsseite erstellen</a></li></ul></li></ul>'
