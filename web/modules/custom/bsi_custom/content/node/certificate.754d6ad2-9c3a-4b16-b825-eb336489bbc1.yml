  body:
    -
      value: '<p>Der Evaluationsgegenstand ist ein integrierter Schaltkreis (IC), der eine Plattform bietet für (IC-) Betriebssysteme und Smartcard-Anwendungsprogramme, aber ebenso in allen anderen Geräten, welche ein hohes Niveau an Widerstandsfähigkeit gegen Angreifer benötigen.</p><p>The TOE is an integrated circuit (IC), providing a platform for an operating system and application software used in smartcards but also in any other device or form factor requiring a high level of resistance against attackers.</p>'
