  field_certification_documents:
    -
      value: '<p>EUCC-3087-2026-0013 / BSI-DSZ-CC-1156-V5-2026<br>(Ausstellungsdatum / <span lang="en-GB" dir="ltr">Certification Date</span> 17.08.2026, gültig bis / <span lang="en-GB" dir="ltr">valid until 23</span>.07.2031)<br><br>Für die Veröffentlichung europäischer Cybersicherheitszertifikate ist die Agentur der Europäischen Union für Cybersicherheit (ENISA) zuständig.Die Zertifizierungsunterlagen zum Verfahren finden Sie auf der <a href="https://certification.enisa.europa.eu/certificates/eucc-3087-2026-000013-i-00_en"><abbr title="European Network and Information Security Agency"><strong>ENISA</strong></abbr><strong> Website</strong></a>.<br><br>Der Evaluationsgegenstand ist ein integrierter Schaltkreis (<abbr title="Identity Card">IC</abbr>), der eine Plattform bietet für (IC-) Betriebssysteme und <span lang="en-GB" dir="ltr">Smartcard</span>-Anwendungsprogramme, aber ebenso in allen anderen Geräten, welche ein hohes Niveau an Widerstandsfähigkeit gegen Angreifer benötigen. Unter anderem wurde in dieser Re-Zertifizierung folgendes geändert: es erfolgte der Übergang von SOG-IS zu EUCC, die Erweiterung ALC_FLR.3 wurde hinzugefügt, TOE Handbücher wurden geändert und angepasst sowie Standorte in den Umfang der Zertifizierung übernommen.<br><br><span lang="en-GB" dir="ltr">The Agency of the European Union for Cybersecurity (ENISA) is responsible for the publication of European cybersecurity certificates.The certification documents for the procedure are available on the </span><a href="https://certification.enisa.europa.eu/certificates/eucc-3087-2026-000013-i-00_en"><abbr title="European Network and Information Security Agency"><span lang="en-GB" dir="ltr"><strong>ENISA</strong></span></abbr><span lang="en-GB" dir="ltr"><strong> website</strong></span></a><span lang="en-GB" dir="ltr">.</span><br><br><span lang="en-GB" dir="ltr">The TOE is an integrated circuit (IC), providing a platform for an operatingsystem and application software used in smartcards but also in any other device or form factor requiring a high level of resistance against attackers. Besides the transition form SOG-IS to EUCC the augmentation ALC_FLR.3 has been added, guidance were also changed and adapted as well as sites have been added to the scope of the certification.</span></p>'
      format: advanced
    -
      value: '<p>BSI-DSZ-CC-1156-V4-2024-MA-01 (Ausstellungsdatum / <span lang="en-GB" dir="ltr">Certification Date</span> 25.03.2025)</p><p><a href="https://www.bsi.bund.de/SharedDocs/Downloads/DE/BSI/Zertifizierung/Reporte/Reporte1100/1156V4MA01a_pdf.pdf?__blob=publicationFile&amp;v=3"><strong>Maintenancereport /</strong><span lang="en-GB" dir="ltr"><strong>Maintenance Report</strong></span></a><br><a href="https://www.bsi.bund.de/SharedDocs/Downloads/DE/BSI/Zertifizierung/Reporte/Reporte1100/1156V4MA01b_pdf.pdf?__blob=publicationFile&amp;v=4"><strong>Sicherheitsvorgaben /</strong><span lang="en-GB" dir="ltr"><strong>Security Target</strong></span></a></p><p>Die Änderungen im Maintenance bezieht sich auf eine editorische Änderung in der User Guidance.</p><p><span lang="en-GB" dir="ltr">The changes are related to an editorial change in the user guidance.</span></p>'
      format: advanced
    -
      value: '<p>BSI-DSZ-CC-1156-V4-2024<br>(Ausstellungsdatum / <span lang="en-GB" dir="ltr">Certification Date</span> 09.09.2024, gültig bis / <span lang="en-GB" dir="ltr">valid until</span> 08.09.2029)<br><br><a href="https://www.bsi.bund.de/SharedDocs/Downloads/DE/BSI/Zertifizierung/Reporte/Reporte1100/1156V4a_pdf.pdf?__blob=publicationFile&amp;v=5"><strong>Zertifizierungsreport /</strong><span lang="en-GB" dir="ltr"><strong>Certification Report</strong></span></a><br><a href="https://www.bsi.bund.de/SharedDocs/Downloads/DE/BSI/Zertifizierung/Reporte/Reporte1100/1156V4b_pdf.pdf?__blob=publicationFile&amp;v=4"><strong>Sicherheitsvorgaben /</strong><span lang="en-GB" dir="ltr"><strong>Security Target</strong></span></a><br><a href="https://www.bsi.bund.de/SharedDocs/Downloads/DE/BSI/Zertifizierung/Reporte/Reporte1100/1156V4c_pdf.pdf?__blob=publicationFile&amp;v=5"><strong>Zertifikat /</strong><span lang="en-GB" dir="ltr"><strong>Certificate</strong></span></a></p><p>Der Evaluationsgegenstand ist ein integrierter Schaltkreis (IC), der eine Plattform bietet für (IC-) Betriebssysteme und <span lang="en-GB" dir="ltr">Smartcard</span>-Anwendungsprogramme, aber ebenso in allen anderen Geräten, welche ein hohes Niveau an Widerstandsfähigkeit gegen Angreifer benötigen. Unter anderem wurde die Anleitung des TOE in dieser Re-Zertifizierung geändert sowie eine optionale Bibliothek für asymmetrische Kryptographie hinzugefügt.<br><br><span lang="en-GB" dir="ltr">The </span><abbr lang="en-GB">TOE</abbr><span lang="en-GB" dir="ltr"> is an integrated circuit (</span><abbr lang="en-GB">IC</abbr><span lang="en-GB" dir="ltr">), providing a platform for an operating system and application software used in smartcards but also in any other device or form factor requiring a high level of resistance against attackers. Besides adding an optional cryptographic library, guidance were also changed and adapted.</span></p>'
      format: advanced
    -
      value: '<p>BSI-DSZ-CC-1156-V3-2022<br>(Ausstellungsdatum / <span lang="en-GB" dir="ltr">Certification Date</span> 16.05.2022, gültig bis / <span lang="en-GB" dir="ltr">valid until </span>15.05.2027)<br><br><a href="https://www.bsi.bund.de/SharedDocs/Downloads/DE/BSI/Zertifizierung/Reporte/Reporte1100/1156V3a_pdf.pdf?__blob=publicationFile&amp;v=4"><strong>Zertifizierungsreport /</strong><span lang="en-GB" dir="ltr"><strong>Certification Report</strong></span></a><br><a href="https://www.bsi.bund.de/SharedDocs/Downloads/DE/BSI/Zertifizierung/Reporte/Reporte1100/1156V3b_pdf.pdf?__blob=publicationFile&amp;v=3"><strong>Sicherheitsvorgaben /</strong><span lang="en-GB" dir="ltr"><strong>Security Target</strong></span></a><br><a href="https://www.bsi.bund.de/SharedDocs/Downloads/DE/BSI/Zertifizierung/Reporte/Reporte1100/1156V3c_pdf.pdf?__blob=publicationFile&amp;v=4"><strong>Zertifikat /</strong><span lang="en-GB" dir="ltr"><strong>Certificate</strong></span></a></p><p>Der Evaluationsgegenstand ist ein integrierter Schaltkreis (IC), der eine Plattform bietet für (IC-) Betriebssysteme und <span lang="en-GB" dir="ltr">Smartcard</span>-Anwendungsprogramme, aber ebenso in allen anderen Geräten, welche ein hohes Niveau an Widerstandsfähigkeit gegen Angreifer benötigen. Unter anderem wurde die Anleitung des <abbr title="Target of Evaluation">TOE</abbr> in dieser Re-Zertifizierung geändert.<br><br><span lang="en-GB" dir="ltr">The </span><abbr lang="en-GB">TOE</abbr><span lang="en-GB" dir="ltr"> is an integrated circuit (</span><abbr lang="en-GB">IC</abbr><span lang="en-GB" dir="ltr">), providing a platform for an operating system and application software used in smartcards but also in any other device or form factor requiring a high level of resistance against attackers. Besides other aspects, guidance were changed in this recertification.</span></p>'
      format: advanced
