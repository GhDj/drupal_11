            field_section_text:
              -
                value: '<p>Here you can order publications in printed form. Simply select a publication from the website and, if necessary, adjust the number of copies to suit your requirements by changing the figure. Then click on the ‘UPDATE’ button. Once your order is complete, click on the ‘ORDER’ button and fill in your order details.</p><p>Please note that larger orders of up to 100 copies are reserved exclusively for public sector organisations. For private individuals and non-public sector organisations, the maximum order quantity is 5 copies per item. It is therefore essential that you state the name of the public sector organisation for which you work.</p>'
                format: advanced
