          field_section_text:
            -
              value: '<p>Hier haben Sie die Möglichkeit Publikationen in gedruckter Form zu bestellen. Wählen Sie einfach eine Publikation von der Website aus und passen Sie ggf. die Anzahl der Exemplare über eine Änderung der Ziffer an Ihren Bedarf an. Anschließend klicken Sie auf den Button AKTUALISIEREN. Ist Ihre Bestellung komplett, so klicken Sie auf den Button BESTELLEN und füllen die Besteller-Daten aus.</p><p>Beachten Sie bitte, dass ausschließlich für öffentliche Einrichtungen eine größere Bestellmenge von bis zu 100 Exemplaren vorbehalten ist. Für Privatpersonen und nicht öffentliche Einrichtungen liegt die maximale Bestellmenge bei 5 Exemplaren pro Artikel. Daher ist die Nennung der öffentlichen Einrichtung für die Sie tätig sind, unabdingbar.</p>'
              format: advanced
