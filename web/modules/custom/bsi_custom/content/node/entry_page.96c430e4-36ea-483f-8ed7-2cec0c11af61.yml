          field_section_text:
            -
              value: '<p>Als die Cybersicherheitsbehörde des Bundes beobachtet das Bundesamt für Sicherheit in der Informationstechnik (BSI) kontinuierlich die Lage der IT‑Sicherheit in Deutschland. Dabei stehen einerseits die Entwicklungen der Bedrohungs‑ und Gefährdungslagen sowie das Wachstum der Angriffsflächen für Cyberangriffe im Fokus des BSI. Andererseits beobachtet das BSI die Entwicklung der gesamtgesellschaftlichen Resilienz gegen Cyberbedrohungen und ‑gefährdungen und treibt Maßnahmen zur Steigerung von Präventions‑, Verteidigungs‑ und Bewältigungsfähigkeiten aktiv voran.</p>'
              format: basic
