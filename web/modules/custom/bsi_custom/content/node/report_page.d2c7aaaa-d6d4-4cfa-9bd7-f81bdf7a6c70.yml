              value: '<p>Das Bundesamt für Sicherheit in der Informationstechnik (BSI) berichtet an das Bundesministerium des Inneren (BMI) und die deutsche Öffentlichkeit einmal jährlich umfassend zur Lage der IT-Sicherheit in Deutschland.</p>'
