              value: '<p><strong>Cybersicherheit in Deutschland messbar machen:</strong> Dieses Ziel haben wir vor einem Jahr ausgerufen – als wichtigen Meilenstein auf dem Weg zur Cybernation Deutschland. <strong>Denn nur, was man messen kann, kann man objektiv verbessern,</strong> und das ist auch dringend geboten: Die Cybersicherheit in Deutschland auf ein Niveau zu heben, das die Resilienz unseres Landes insgesamt signifikant erhöht, ist eines unserer Kernziele, denen unser gesamtes Engagement untergeordnet ist.</p><p>Mit der Veröffentlichung des diesjährigen Berichts zur Lage der IT-Sicherheit in Deutschland sind wir dem erstgenannten Ziel ein beachtliches Stück nähergekommen: <strong>Die Cybersicherheitslage ist messbarer geworden,</strong> und zwar in den Dimensionen Bedrohungen, Angriffsfläche, Gefährdungen, Schadwirkung und Resilienz. Unser Lagebericht stellt erstmals konsequent statistische Indikatoren in den Vordergrund: Trends, Wechselbeziehungen, Erfolge und Handlungsbedarfe werden auf Datenbasis sichtbar. Wahr ist aber auch: Mit Blick auf das Ziel, die Cybersicherheitslage in Deutschland zu verbessern, haben wir alle gemeinsam – Staat, Wirtschaft, Wissenschaft und Gesellschaft – noch ein großes Stück Arbeit vor uns. Denn <strong>die Gesamtlage ist nach wie vor angespannt.</strong>&nbsp;</p><p>Schaut man etwas genauer hin, erkennt man jedoch: Die Lage ist dynamisch, und in einzelnen Dimensionen hat sie sich in der Tat verbessert. Denn erstens können wir eine <strong>Bedrohungslage</strong> konstatieren, die sich ein kleines bisschen entspannt hat. Diesen Umstand haben wir auch schlagkräftigen internationalen Strafverfolgungsmaßnahmen zu verdanken, bei denen wir als BSI zum Teil technisch unterstützt haben und die dazu führten, dass gleich zwei vormals sehr aktive Angreifergruppen ihre Aktivitäten nahezu vollständig eingestellt haben. Inwieweit andere Gruppierungen diese Lücke füllen, bleibt abzuwarten. Zweitens stellen wir fest, dass unsere <strong>Resilienzmaßnahmen</strong> im Bereich der Kritischen Infrastrukturen mehr und mehr Wirkung entfalten. Mit der nun unmittelbar bevorstehenden Umsetzung der europäischen NIS-2-Richtlinie in nationales Recht wird sich dieser Effekt zügig auf einen sechsfachen Radius im Bereich der Wirtschaft ausweiten, und mit Inkrafttreten des Cyber Resilience Acts (CRA) werden wir ähnlich spürbare Effekte auf Produktebene erzielen.</p><p>Das war es aber leider auch schon mit den guten Nachrichten. Der sich stabilisierenden Bedrohungslage steht nämlich eine mit dem Fortschritt der Digitalisierung nicht nur immer größer werdende, sondern auch immer schlechter geschützte <strong>Angriffsfläche</strong> gegenüber. So waren beispielsweise bei fast der Hälfte der online erreichbaren IP-Adressen im deutschen Internet sensible Informationen öffentlich einsehbar. Dafür muss man dann noch nicht einmal ein erfahrener Hacker sein, um solche Schwächen auszunutzen. Auch digitale Kommunikationswege wie Social-Media-Accounts, Messenger und E-Mail bilden große, schwer schützbare Angriffsflächen. Um das Thema E-Mail-Sicherheit hat sich das BSI gemeinsam mit den Verbänden eco und Bitkom im Rahmen einer Aktionskampagne gekümmert, der sich rund 150 Unternehmen angeschlossen haben: Unser gemeinsames Ziel ist, den Kanal E-Mail in Deutschland endlich in der Fläche sicherer zu machen – denn so wie bisher kann und darf es nicht weitergehen.</p><p>Apropos schlecht geschützt: Was uns besonders besorgt, sind Angriffsziele, die wir als <strong>vulnerable Gruppen</strong> bezeichnen und auf die sich Angreifer im Cyberraum immer häufiger stürzen. Man könnte auch sagen, <strong>es gibt einen Trend zu „leichter Beute“.</strong> Gemeint sind kleine Unternehmen, Kommunen, Vereine, Verbände, Institutionen des vorpolitischen Raumes sowie Verbraucherinnen und Verbraucher: Sie alle haben gemeinsam, dass es ihnen häufig nicht nur an Wissen, Ressourcen und Fähigkeiten zur IT-Sicherheit mangelt, sondern zu oft auch an der grundsätzlichen Einsicht, dass sie sehr wohl lohnende Ziele für Cyberangriffe sind. Unter dem Kosten-Nutzen-Kalkül der Angreifenden gibt es im Jahr 2025 nämlich keine uninteressanten Ziele mehr, bei denen vermeintlich „nichts zu holen“ wäre.</p><p>Daraus folgt: Für das kommende Jahr ist es nicht nur unsere gesamtstaatliche Aufgabe, Menschen, Institutionen und Organisationen in Deutschland stärker als bisher für Bedrohungen im digitalen Raum zu sensibilisieren. Wir müssen darüber hinaus auch stärker ins Handeln kommen, indem wir aktiv <strong>Schutzmaßnahmen</strong> umsetzen – und zwar <strong>für alle.</strong> Dazu gehören neben einer robusteren Cybersicherheitsarchitektur, die auch Länder und Kommunen einbezieht, leicht umsetzbare Hilfestellungen sowie eine vernünftige und unbürokratische Regulierungsdurchsetzung.&nbsp;</p><p>Wir müssen und werden uns resilient aufstellen, indem wir unsere Angriffsflächen widerstandsfähig gegen Cyberaggression in all ihren Spielarten machen: gegen <strong>Cyber Crime</strong> (Straftaten aus finanziellen Motiven), gegen <strong>Cyber Conflict</strong> (staatlich gelenkte Angriffe mit politischem oder militärischem Hintergrund) wie auch gegen <strong>Cyber Dominance</strong> (die Fähigkeit von Herstellern digitaler Produkte, dauerhaft Zugriff auf Systeme und Informationen ihrer Kundinnen und Kunden zu behalten). Dieser Bericht zur Lage der IT-Sicherheit macht mehr als deutlich: <strong>Wenn wir es nicht kurzfristig schaffen, uns und unsere Angriffsflächen gegen das gesamte Bedrohungsspektrum zu verteidigen, werden wir verwundbar bleiben – und früher oder später auch verwundet werden. Lassen wir es also nicht so weit kommen.&nbsp;</strong></p><p>Ihre</p><p>Claudia Plattner</p>'
