          field_section_text:
            -
              value: '<p>Die Cybersicherheit in Deutschland musste auch im vergangenen Jahr an vielen Fronten verteidigt werden. Durch die geopolitischen Entwicklungen hat sich die Bedrohungslage weiter verschärft: Insbesondere russische Akteure greifen die IT-Strukturen deutscher Unternehmen, Kommunen und Privatleute an. Auch Kriminelle mit rein monetären Interessen haben es auf unsere Daten abgesehen. Gleichzeitig wollen und müssen wir die Digitalisierung in unserem Land voranbringen und dabei für sichere Informationstechnik sorgen.</p><p>Digitale Prozesse verfügbar zu machen ist die Voraussetzung für mehr Service und weniger Bürokratie. Digitalisierung dient so den Bürgerinnen und Bürgern wie der Wirtschaft. Um diesen Weg trittfest und zugänglich zu gestalten, hat die Bundesregierung das Bundesministerium für Digitalisierung und Staatsmodernisierung gegründet.&nbsp;</p><p>Aber im gleichen Maß, in dem wir Digitalisierung vorantreiben, müssen wir im BMI auch IT-Sicherheit fordern und fördern. Denn Nutzerinnen und Nutzer akzeptieren nur solche Informationstechnik, die sicher ist. Cybersicherheit macht daher den Weg zum digitalen Staat erst gangbar. Im vorliegenden Bericht zu ihrer Lage in Deutschland 2025 sind die Kapitel zu Angriffsfläche und Resilienz entsprechend die umfangreichsten.</p><p>Als weiteren Eckpfeiler zur Stärkung der Cybersicherheit hat die Bundesregierung im August die Schaffung des deutschen Cyberdomes beschlossen: ein System zur teilautomatisierten Abwehr im Netz, um Schäden durch Cyberangriffe zu reduzieren und bestenfalls zu vermeiden.&nbsp;</p><p>In Bezug auf die Breite möglicher Handlungsfelder ist dieser BSI-Lagebericht eine wichtige Entscheidungshilfe für die Auswahl und die Priorisierung von Maßnahmen zu mehr Cybersicherheit. Das gilt nicht nur für Regierung und Wirtschaft, sondern darüber hinaus für Bürgerinnen und Bürger: Denn der aufgezeigte Trend zur wachsenden Sorglosigkeit von Verbraucherinnen und Verbrauchern ist höchst bedenklich. Das Wissen über Maßnahmen, mit denen die oder der Einzelne seine Accounts schützen kann, ist leider weniger geworden, und die Bereitschaft, sie anzuwenden, insbesondere unter jüngeren Menschen nur gering. Aber der Lagebericht zeigt zudem: Es gibt keine uninteressanten Ziele für Cyberangriffe, solange Aufwand und Nutzen in einem für Angreifer günstigen Verhältnis stehen.&nbsp;</p><p>Auch deshalb ist dieser Bericht so wichtig: Indem er die ganze Bandbreite möglicher Angriffs- und Schutzpunkte aufzeigt, schärft er das Bewusstsein dafür, wie wichtig Cybersicherheit für jede und jeden Einzelnen von uns und für die Cybernation Deutschland ist. Unsere Gesellschaft, unsere Wirtschaft und letztlich unsere Demokratie als solche sind darauf angewiesen. Ich danke allen daher herzlich, die an diesem wichtigen Bericht mitgewirkt haben.</p><p>Ihr</p><p>Alexander Dobrindt</p>'
