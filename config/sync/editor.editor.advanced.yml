uuid: b6505fc3-036d-4bb7-a82d-f22886c45107
langcode: en
status: true
dependencies:
  config:
    - filter.format.advanced
  module:
    - ckeditor5
format: advanced
editor: ckeditor5
settings:
  toolbar:
    items:
      - heading
      - style
      - textPartLanguage
      - '|'
      - undo
      - redo
      - '|'
      - showBlocks
      - sourceEditing
      - '-'
      - bold
      - italic
      - subscript
      - superscript
      - '|'
      - alignment
      - bulletedList
      - numberedList
      - '|'
      - link
      - anchor
      - abbreviation
      - drupalMedia
      - insertTable
      - toggleInlineQuote
      - blockQuote
      - code
      - codeBlock
  plugins:
    ckeditor5_alignment:
      enabled_alignments:
        - center
        - justify
        - left
        - right
    ckeditor5_codeBlock:
      languages:
        -
          label: 'Plain text'
          language: plaintext
        -
          label: C
          language: c
        -
          label: 'C#'
          language: cs
        -
          label: C++
          language: cpp
        -
          label: CSS
          language: css
        -
          label: Diff
          language: diff
        -
          label: HTML
          language: html
        -
          label: Java
          language: java
        -
          label: JavaScript
          language: javascript
        -
          label: PHP
          language: php
        -
          label: Python
          language: python
        -
          label: Ruby
          language: ruby
        -
          label: TypeScript
          language: typescript
        -
          label: XML
          language: xml
    ckeditor5_heading:
      enabled_headings:
        - heading2
        - heading3
        - heading4
        - heading5
        - heading6
    ckeditor5_language:
      language_list: all
    ckeditor5_list:
      properties:
        reversed: false
        startIndex: false
        styles: false
      multiBlock: true
    ckeditor5_sourceEditing:
      allowed_tags:
        - '<cite>'
        - '<dl>'
        - '<dt>'
        - '<dd>'
        - '<a hreflang>'
        - '<blockquote cite>'
        - '<h2 id>'
        - '<h3 id>'
        - '<h4 id>'
        - '<h5 id>'
        - '<h6 id>'
        - '<span>'
    ckeditor5_style:
      styles:
        -
          label: Frame
          element: '<p class="border">'
        -
          label: 'Line Gray'
          element: '<p class="highlight">'
        -
          label: 'Line Blue (secondary)'
          element: '<p class="highlight secondary">'
        -
          label: 'Yellow Box'
          element: '<p class="box">'
        -
          label: 'Gray Box (secondary)'
          element: '<p class="box secondary">'
        -
          label: 'Button (secondary)'
          element: '<a class="bsi-link bsi-link--button bsi-link--secondary-button">'
    linkit_extension:
      linkit_enabled: true
      linkit_profile: default
    media_media:
      allow_view_mode_override: false
image_upload:
  status: false
